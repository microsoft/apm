# Replay row template for the TARGET family (tests/lifecycle/replay/rows/).
# Use only when tests/lifecycle/ exists; until then write an
# ApmLifecycleRunner test from test_lifecycle_promise.py.txt.
#
# Rules:
# - every id in `promises` resolves in the promise catalog;
# - no --no-policy unless --no-policy is the subject of the row;
# - `given` reaches a converged state; `when` holds the mutating step(s);
# - `then` is checked by the oracles (expected_deployed(model) and I1-I9),
#   never by stdout substrings.
id: T1/update/revoked/lsp
promises: [P-INV-I4, P-OWN-executable-trust-context]
world:
  packages: [p-lsp, p-skill]
  targets: [copilot, claude]
  scope: project
given:
  - apm install p-lsp p-skill
  - apm approve p-lsp
  - apm install
when:
  - apm deny p-lsp
  - apm update --yes
then:
  exit: 0
  deployed: expected
  announce: retired
