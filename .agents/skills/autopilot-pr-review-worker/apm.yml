name: autopilot-pr-review-worker
version: 0.1.0
description: Multi-persona advisory review panel for a labelled pull request -- fans out to specialist personas + a CEO synthesizer, posts one recommendation comment, never gates merge.
author: Microsoft
license: MIT
type: skill

# Stand-alone primitive: no transitive APM deps. Specialist roles are
# consumer-provided companions checked in the deployed .github/agents/
# directory before the worker begins the panel.
dependencies:
  apm:
    - ../autopilot-comment
  mcp: []
