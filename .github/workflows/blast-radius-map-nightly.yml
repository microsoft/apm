# Nightly blast-radius coverage map (#4117).
#
# Runs the integration suite with per-test coverage contexts
# (--cov-context=test). CLI subprocesses are measured through a .pth hook
# (COVERAGE_PROCESS_START) and attributed to the running test through
# APM_BLAST_RADIUS_CONTEXT. The combined data becomes the `blast-radius-map`
# artifact {schema_version, generated_at, commit, run_id, mark_expr,
# test_count, files: {src path: [node id]}} that ci-blast-radius.yml reads.
# The PR planner rejects a map older than 48 h, so a failing nightly makes
# PRs fall back to the full suite instead of a stale slice.
name: Blast Radius Map (nightly)

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blast-radius-map
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  MARK_EXPR: "not live and not benchmark and not requires_github_token and not requires_network_integration"
  SHARD_COUNT: 4

jobs:
  coverage-shard:
    name: Blast Radius Coverage Shard ${{ matrix.shard }} (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install Unix shell startup test runtimes
      run: bash scripts/ci-apt-install.sh fish zsh

    - name: Install dependencies
      run: uv sync --frozen --extra dev

    - name: Install subprocess coverage hook
      run: uv run --frozen --extra dev python scripts/blast_radius.py install-subprocess-hook

    # Test failures do not void the map: a failing test still covered code.
    - name: Run integration shard with per-test coverage contexts
      env:
        APM_E2E_TESTS: "1"
        COVERAGE_PROCESS_START: ${{ github.workspace }}/build/blast-radius.coveragerc
      run: |
        mkdir -p build
        printf '[run]\nsource = src/apm_cli\nparallel = true\nrelative_files = true\ndata_file = %s/.coverage\n' \
          "$GITHUB_WORKSPACE" > build/blast-radius.coveragerc
        set +e
        uv run --frozen --extra dev python -m pytest -p no:cacheprovider -q \
          -p scripts.blast_radius \
          -p scripts.ci_sharding --shard-count "$SHARD_COUNT" --shard-index "${{ matrix.shard }}" \
          --shard-durations .github/ci-durations/linux-x86_64.json \
          --cov=src/apm_cli --cov-config=build/blast-radius.coveragerc --cov-context=test \
          --cov-report= -n 4 --dist loadgroup -m "$MARK_EXPR" tests/integration
        echo "pytest exit: $?"
        uv run --frozen --extra dev coverage combine --append --rcfile=build/blast-radius.coveragerc || true

    - name: Upload shard coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blast-radius-coverage-${{ matrix.shard }}
        path: .coverage
        include-hidden-files: true
        retention-days: 3
        if-no-files-found: error

  build-map:
    name: Build Blast Radius Map (Linux)
    needs: coverage-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --extra dev

    - name: Require every coverage shard
      env:
        SHARD_RESULT: ${{ needs.coverage-shard.result }}
      run: |
        if [ "$SHARD_RESULT" != success ]; then
          echo "::error::Every coverage shard must upload data; got '$SHARD_RESULT'. No map is published, so PRs run the full suite."
          exit 1
        fi

    - name: Download shard coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: blast-radius-coverage-*
        path: coverage-shards

    - name: Combine and build the map
      run: |
        for shard in coverage-shards/*/; do
          cp "$shard/.coverage" ".coverage.$(basename "$shard")"
        done
        uv run --frozen --extra dev coverage combine --data-file=.coverage .coverage.*
        uv run --frozen --extra dev python scripts/blast_radius.py build-map \
          --data .coverage --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
          --mark-expr "$MARK_EXPR" --out blast-radius-map.json

    - name: Upload blast-radius map
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blast-radius-map
        path: blast-radius-map.json
        retention-days: 7
        if-no-files-found: error
