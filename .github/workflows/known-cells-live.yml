name: Known Cells Live (ledger state)

# Every strict known cell cites a tracking issue that must stay open (#4565).
# Pull requests check the committed snapshot only, and a train runs the live
# check in merge-train.yml's guard (fail-closed). This workflow reads the live
# state on every main push and daily (#5072). It stays out of main-push-gate.yml
# on purpose: a failure here is a ledger-state red (a tracking issue changed
# state), not a code red, so it never turns the main push gate red. It opens
# (or updates) one tracking issue naming the fix owner and ETA; the next green
# run closes it.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: known-cells-live-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    name: Known cells cite open issues (live, ledger state)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install frozen development dependencies
        run: uv sync --frozen --extra dev

      - name: Known cells cite open issues (live GitHub state)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --extra dev python -m tests.quality.known_cell_issues --check-live

  signal:
    name: Known Cells Live Signal
    needs: [check]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.check.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = '<!-- apm-known-cells-live -->';
            const LABEL = 'ci/known-cells-live';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = process.env.RESULT !== 'success';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'D93F0B',
                description: 'Scheduled live check of known-cell tracking issues',
              });
            }
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const issue = open.find((item) => !item.pull_request && (item.body || '').includes(MARKER));
            if (failed) {
              const body = [
                MARKER,
                'A strict known cell cites an issue that is no longer open, or the live state could not be read.',
                '',
                'Classification: ledger-state red (a tracking issue changed state), not a code red. It does not fail the main push gate.',
                'Owner: Quality & Lifecycle. Fix ETA: 60 minutes.',
                '',
                `- Run: [${context.runNumber}](${runUrl})`,
                `- Head SHA: \`${context.sha}\``,
                `- Trigger: ${context.eventName}`,
                `- Result: ${process.env.RESULT}`,
                '',
                'The run log names each cell. Rerun it; flip a cell that now passes to required (or re-key it to an open issue), then run `python -m tests.quality.known_cell_issues --write`.',
              ].join('\n');
              if (issue) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number, body: `Still failing: ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title: '[ci] A known cell cites a closed issue', body, labels: [LABEL],
                });
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body: `Recovered: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
