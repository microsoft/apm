name: Known Cells Live (ledger state)

# RT3 v0.39 red-team scratch branch ONLY (never merged): runs the hostile
# Windows cells on the release candidate via workflow_dispatch.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rt3:
    name: RT3 red team (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --quiet
      - name: RT3 cells
        shell: bash
        run: >-
          uv run --frozen python -m pytest -p no:cacheprovider -p no:randomly -rA -v -s
          tests/unit/utils/test_rt3_windows_redteam.py
          tests/unit/utils/test_realpath_win.py
          tests/integration/test_realpath_win.py
