name: Known Cells Live (ledger state)

# Every strict known cell cites a tracking issue that must stay open (#4565).
# Pull requests check the committed snapshot only, and a train runs the live
# check in merge-train.yml's guard (fail-closed). This workflow reads the live
# state on every main push and daily (#5072). It stays out of main-push-gate.yml
# on purpose: a failure here is a ledger-state red (a tracking issue changed
# state), not a code red, so it never turns the main push gate red. It opens
# (or updates) one tracking issue naming the fix owner and ETA; the next green
# run closes it.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Known cells cite open issues (live, ledger state)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cells: ${{ steps.live.outputs.cells }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install frozen development dependencies
        run: uv sync --frozen --extra dev

      # The failing cells' [x] lines go to the signal job as a step output, so
      # the tracking issue names each cell; the step keeps the check's exit status.
      - name: Known cells cite open issues (live GitHub state)
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run --frozen --extra dev python -m tests.quality.known_cell_issues --check-live > "$RUNNER_TEMP/live.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/live.txt"
          # An unguessable delimiter: a cell line can never end the output early.
          delimiter="cells_$(openssl rand -hex 16)"
          {
            echo "cells<<$delimiter"
            grep '^\[x\]' "$RUNNER_TEMP/live.txt" | head -n 50 || true
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

  signal:
    name: Known Cells Live Signal
    needs: [check]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One signal at a time across runs, so two failures never open two issues.
    concurrency:
      group: known-cells-live-signal
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.check.result }}
          CELLS: ${{ needs.check.outputs.cells }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = '<!-- apm-known-cells-live -->';
            const RUN_MARKER = /<!-- apm-known-cells-live-run:(\d+) -->/;
            const LABEL = 'ci/known-cells-live';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = process.env.RESULT !== 'success';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'D93F0B',
                description: 'Scheduled live check of known-cell tracking issues',
              });
            }
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const issue = open.find((item) => !item.pull_request && (item.body || '').includes(MARKER));
            // A run older than the one the issue records is stale: it never edits the issue.
            const recorded = Number(((issue && issue.body) || '').match(RUN_MARKER)?.[1] || 0);
            if (issue && recorded > context.runId) {
              core.info(`Run ${context.runId} is older than recorded run ${recorded}; no change.`);
              return;
            }
            const cells = (process.env.CELLS || '').trim();
            if (failed) {
              const body = [
                MARKER,
                `<!-- apm-known-cells-live-run:${context.runId} -->`,
                'A strict known cell cites an issue that is no longer open, or the live state could not be read.',
                '',
                'Classification: ledger-state red (a tracking issue changed state), not a code red. It does not fail the main push gate.',
                'Owner: Quality & Lifecycle. Fix ETA: 60 minutes.',
                '',
                `- Run: [${context.runNumber}](${runUrl})`,
                `- Head SHA: \`${context.sha}\``,
                `- Trigger: ${context.eventName}`,
                `- Result: ${process.env.RESULT}`,
                '',
                '### Affected cells',
                '',
                cells ? ['````', cells, '````'].join('\n') : 'No cell line was captured (the live state could not be read); see the run log.',
                '',
                'The run log names each cell. Rerun it; flip a cell that now passes to required (or re-key it to an open issue), then run `python -m tests.quality.known_cell_issues --write`.',
              ].join('\n');
              if (issue) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number, body: `Still failing: ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title: '[ci] A known cell cites a closed issue', body, labels: [LABEL],
                });
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body: `Recovered: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
