name: Known Cells Live (ledger state)

# RT3 v0.39 red-team scratch branch ONLY (never merged): runs the hostile
# Windows cells on the release candidate via workflow_dispatch.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rt3:
    name: RT3 red team (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --quiet
      - name: v0.38.1 CLI
        shell: bash
        run: |
          git fetch --quiet --no-tags https://github.com/microsoft/apm.git a243ac325589566788e4b9a39ffec9188ca93551
          git worktree add --quiet --detach ../v0381 FETCH_HEAD
          (cd ../v0381 && uv sync --frozen --no-editable --quiet)
      - name: Output delta, v0.38.1 vs RC (content)
        shell: bash
        run: |
          set +e +o pipefail
          rel=$([ "$RUNNER_OS" = Windows ] && echo .venv/Scripts/apm.exe || echo .venv/bin/apm)
          for side in v0381 rc; do
            apm=$([ $side = v0381 ] && echo "$GITHUB_WORKSPACE/../v0381/$rel" || echo "$GITHUB_WORKSPACE/$rel")
            for journey in install-cold uninstall; do
              work="$RUNNER_TEMP/w-$side-$journey"
              uv run --frozen python -m tests.benchmarks.journeys run --apm "$apm" --fixtures tree-50 \
                --journeys $journey --rtt 0 --runs 1 --max-load 1000000 --load-wait-min 0 \
                --work "$work" --out "$RUNNER_TEMP/o-$side-$journey" > /dev/null 2>&1 || echo "[x] $side $journey failed"
              proj="$work/runs/tree-50/project"
              echo "===== $side $journey ====="
              echo "--- .gitignore (od -c head)"; od -c "$proj/.gitignore" | head -8
              echo "--- .mcp.json"; cat "$proj/.mcp.json" 2>/dev/null || echo "(absent)"
              echo "--- lock mcp"; grep -n -A12 -iE '^mcp' "$proj/apm.lock.yaml" | head -40
              echo "--- .gitignore text"; cat "$proj/.gitignore"
              echo "--- lock top-level keys"; grep -nE '^[a-z_]+:' "$proj/apm.lock.yaml" | head -40
              cp "$proj/apm.lock.yaml" "$RUNNER_TEMP/lock-$side-$journey.yaml"
            done
          done
          echo "===== lock diff (uninstall) v0381 -> rc ====="
          diff <(grep -vE '^(generated_at|apm_version):' "$RUNNER_TEMP/lock-v0381-uninstall.yaml") \
               <(grep -vE '^(generated_at|apm_version):' "$RUNNER_TEMP/lock-rc-uninstall.yaml") | head -60
