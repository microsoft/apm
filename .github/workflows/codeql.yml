name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
    types: [ checks_requested ]
  schedule:
    # Run weekly on Mondays at 05:00 UTC
    - cron: '0 5 * * 1'

# Superseded pushes to a PR cancel their in-flight run so they stop spending
# the shared Actions API quota. Push, merge_group and schedule runs are never
# grouped or cancelled: each run keeps its own group, so every SHA keeps its
# evidence.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.language == 'python' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ python, actions ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
