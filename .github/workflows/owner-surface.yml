# Owner Surface -- a cheap PR check for owner and install-path changes.
#
# Today's main reds (the lockfile-read owner test after #4067, the codex
# bundle e2e after #4007) lived in integration shards that run only on
# merge_group or dispatch. This workflow runs, on every pull request, only the
# slice of those shards a change can reach (scripts/owner_surface.py):
#   - owner surfaces: src/apm_cli/install/*, src/apm_cli/deps/lockfile*,
#     .apm/architecture/*, scripts/architecture_linter/*,
#     tests/integration/test_architecture_*.py, tests/integration/test_install_*.py,
#     and every file an owner registry selector names;
#   - slice: owner-rule mutation cases and architecture tests that name a
#     changed file or an affected owner, guard or rule, plus every
#     tests/integration/test_install_*.py file for install-path changes.
# The full integration suite still runs once per train head (merge_group,
# merge-train refs), never per pull request. scripts/owner_surface.py splits
# the slice into the matrix's shards itself (the count is strategy.job-total):
# scripts.ci_sharding refuses empty shards, so a slice too small to split runs
# whole on shard 1. Four shards, because the durations file is measured on the
# whole suite, while each slice shard pays the 40-80s module baselines of the
# mutation tests per worker: an install-path slice took 14m on 3 shards (#4746).
#
# `Owner Surface Check` always reports and is REQUIRED: merge-gate.yml lists it
# in every EXPECTED_CHECKS context, and merge-train.yml calls this workflow
# as its `owner` tier through workflow_call. Every job runs on every event;
# only the slice's steps are gated on `run`, so off a pull request (merge
# group, merge train) the slice is a fast no-op and the check passes, while
# ci-integration.yml runs the whole suite there.
name: Owner Surface

# No paths: filter: a filtered-out run would never report the check.
on:
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
    types: [ checks_requested ]
  # merge-train.yml calls this as its `owner` tier (a no-op slice there).
  workflow_call:
    inputs:
      base_sha:
        description: Base main SHA of the train.
        required: false
        type: string

# Superseded pushes to a PR cancel their run; merge_group runs never cancel.
concurrency:
  group: owner-surface-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  HERMETIC_MARK_EXPR: "not live and not requires_github_token and not requires_network_integration"

jobs:
  select:
    name: Owner Surface Select
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Plan the owner-surface slice
      id: plan
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$EVENT" != pull_request ]; then
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "$EVENT: ci-integration.yml runs the whole integration suite here."
          exit 0
        fi
        python3 -m scripts.owner_surface plan --base "$BASE_SHA" --out owner-surface-changed.txt

  slice:
    name: Owner Surface Slice (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [select]
    runs-on: ubuntu-24.04
    # About 1.5x the expected p95 (13 minutes) of an install-path slice on 4 shards.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.select.outputs.run == 'true'
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      if: needs.select.outputs.run == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      if: needs.select.outputs.run == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        save-cache: false

    - name: Install dependencies
      if: needs.select.outputs.run == 'true'
      run: uv sync --frozen --extra dev

    - name: Run the owner-surface slice
      if: needs.select.outputs.run == 'true'
      env:
        APM_E2E_TESTS: "1"
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SHARD: ${{ matrix.shard }}
        SHARD_COUNT: ${{ strategy.job-total }}
      run: |
        python3 -m scripts.owner_surface plan --base "$BASE_SHA" --out owner-surface-changed.txt
        uv run --frozen --extra dev python -m scripts.owner_surface run \
          --base "$BASE_SHA" --changed owner-surface-changed.txt \
          --shard "$SHARD/$SHARD_COUNT" --durations .github/ci-durations/linux-x86_64.json -- \
          -p no:cacheprovider -m "$HERMETIC_MARK_EXPR" -n 4 --dist loadgroup --durations=15

  owner-surface:
    name: Owner Surface Check
    needs: [select, slice]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Require the selected slice
      env:
        SELECT_RESULT: ${{ needs.select.result }}
        RUN: ${{ needs.select.outputs.run }}
        SLICE_RESULT: ${{ needs.slice.result }}
      run: |
        # Every job runs on every event; only the slice's steps are gated, so
        # a skipped owner surface still ends the slice job in success.
        if [ "$SELECT_RESULT" != success ] || [ "$SLICE_RESULT" != success ]; then
          echo "::error::Owner Surface Check failed: select=$SELECT_RESULT slice=$SLICE_RESULT (run=$RUN)."
          exit 1
        fi
        echo "Owner Surface Check passed (run=$RUN, slice=$SLICE_RESULT)."
