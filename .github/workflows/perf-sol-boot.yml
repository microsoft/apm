name: Perf SoL trace (research)

on:
  push:
    branches: [perf-research/arch-trace11]

permissions:
  contents: read

jobs:
  trace:
    name: trace ${{ matrix.os }} ${{ matrix.product }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, product: 67adc6711f4a8a6b7542122ce878e121d710b540}
          - {os: ubuntu-24.04, product: 43cc0f56dffe8f07567c9f8265f9fc3b48b9295f}
          - {os: ubuntu-24.04, product: e140fb0339f2da4e79c0c13df3cdf8a99e7fea43}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - name: Install product e62f520f
        run: |
          set -euo pipefail
          git -C harness fetch --quiet --no-tags https://github.com/${GITHUB_REPOSITORY}.git ${{ matrix.product }}
          git -C harness worktree add --quiet --detach ../side FETCH_HEAD
          (cd side && uv sync --frozen --no-editable --quiet)
          if [ "$RUNNER_OS" = Windows ]; then APM=side/.venv/Scripts/apm.exe; else APM=side/.venv/bin/apm; fi
          echo "APM_ABS=$GITHUB_WORKSPACE/$APM" >> "$GITHUB_ENV"
          (cd harness && uv sync --frozen --extra dev --quiet)
      - name: Traced locked-warm + warm
        working-directory: harness
        env:
          APM_INSTALL_FAST_PATH: trace
          APM_BENCH_PASS_ENV: APM_INSTALL_FAST_PATH,APM_RESEARCH_PHASECPU
          APM_RESEARCH_PHASECPU: "1"
          APM_BENCH_NO_IMPORTTIME: "1"
        run: |
          set -euo pipefail
          APM_BENCH_IMPORTTIME_DIR="$GITHUB_WORKSPACE/out/stderr" uv run --frozen python -m tests.benchmarks.journeys run --fixtures tree-50 --journeys install-cold --rtt 30 --runs 1 --apm "$APM_ABS" --out "$GITHUB_WORKSPACE/out/j" --work "$GITHUB_WORKSPACE/work"
          for f in "$GITHUB_WORKSPACE"/out/stderr/*.txt; do echo "== $f"; grep -h "oracle-\|install fast path" "$f"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trace-${{ matrix.os }}-${{ matrix.product }}
          path: out/
