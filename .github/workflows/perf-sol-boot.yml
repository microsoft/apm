name: Perf SoL fast-path differential (research)

on:
  push:
    branches: [perf-research/arch-fastdiff]

permissions:
  contents: read

jobs:
  diff:
    name: diff ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - name: Install product (main)
        run: |
          set -euo pipefail
          git -C harness fetch --quiet --no-tags https://github.com/${GITHUB_REPOSITORY}.git 1e4a208e073a3ea1484f71ceba8d065f23a815ec
          git -C harness worktree add --quiet --detach ../side FETCH_HEAD
          (cd side && uv sync --frozen --no-editable --quiet)
          if [ "$RUNNER_OS" = Windows ]; then APM=side/.venv/Scripts/apm.exe; else APM=side/.venv/bin/apm; fi
          echo "APM_ABS=$GITHUB_WORKSPACE/$APM" >> "$GITHUB_ENV"
          (cd harness && uv sync --frozen --extra dev --quiet)
      - name: Differential
        working-directory: harness
        run: uv run --frozen python scripts/perf/fastpath_diff.py "$APM_ABS" "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/out/diff-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: diff-${{ matrix.os }}
          path: out/
