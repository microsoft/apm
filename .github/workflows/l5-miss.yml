name: L5 miss cell
on:
  push:
    branches: ['perf-miss/**']
permissions:
  contents: read
jobs:
  miss:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: mine
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        path: harness
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Install both CLIs
      run: |
        set -euo pipefail
        for side in base new; do
          sha=$(cat mine/scripts/perf/l5_miss_$side)
          git -C harness fetch --quiet --no-tags origin "$sha"
          git -C harness worktree add --quiet --detach "../$side" FETCH_HEAD
          (cd "$side" && uv sync --frozen --no-editable --quiet)
        done
    - name: Harness
      working-directory: harness
      run: |
        uv sync --frozen --extra dev --quiet
        cp ../mine/scripts/perf/l5_miss.py scripts/perf/l5_miss.py
    - name: Miss cell
      working-directory: harness
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then b=Scripts/python.exe; else b=bin/python; fi
        cp ../mine/scripts/perf/l5_outputs.py scripts/perf/
        if [ "$RUNNER_OS" = "Windows" ]; then a=Scripts/apm.exe; else a=bin/apm; fi
        uv run --frozen python scripts/perf/l5_outputs.py "$GITHUB_WORKSPACE/base/.venv/$a" "$RUNNER_TEMP/l5o" tree-10
