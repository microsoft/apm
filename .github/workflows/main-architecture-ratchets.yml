name: Main Architecture Ratchets

env:
  PYTHON_VERSION: '3.12'

# ci.yml runs the architecture ratchet contracts on pull_request and
# merge_group only. A change that reaches main without a merge_group run
# skips them, so main can go red with no signal and every open PR inherits
# the failure. This workflow re-runs the same contract job on every push to
# main. tests/quality/test_ci_topology.py pins it to ci.yml's
# test-architecture-contracts job, so the two selections cannot drift.
on:
  push:
    branches: [ main ]

# Every push keeps its own run: each main SHA keeps its evidence.
concurrency:
  group: main-architecture-ratchets-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-architecture-contracts:
    name: Architecture Ratchet Contracts (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --extra dev

    - name: Run ratchet contract tests
      run: |
        uv run --frozen --extra dev pytest -p no:cacheprovider -q \
          tests/unit/scripts/test_check_test_assertions.py \
          tests/unit/scripts/test_check_exact_test_duplicates.py \
          tests/unit/scripts/test_check_complexity_ratchet.py \
          tests/quality/test_test_taxonomy.py \
          tests/quality/test_quality_baselines.py \
          tests/quality/test_lifecycle_bug_ledger.py \
          tests/quality/test_ci_topology.py \
          tests/quality/test_promise_obligations.py \
          tests/quality/test_cli_docs_surface.py \
          tests/quality/test_journey_index.py
