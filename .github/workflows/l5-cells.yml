name: L5 cells
on:
  push:
    branches: ['perf-cells/**']
permissions:
  contents: read
jobs:
  cells:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: mine
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Checkout CLI under test
      run: |
        set -euo pipefail
        sha=$(cat mine/scripts/perf/l5_cells_sha)
        git -C mine fetch --quiet --no-tags origin "$sha"
        git -C mine worktree add --quiet --detach ../new FETCH_HEAD
    - name: Cells
      working-directory: new
      run: |
        uv sync --frozen --extra dev --quiet
        uv run --frozen pytest -q -p no:cacheprovider -n 2 $(cat ../mine/scripts/perf/l5_cells_tests) 2>&1 | tail -60
        exit ${PIPESTATUS[0]}
