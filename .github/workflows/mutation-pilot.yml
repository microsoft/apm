name: Mutation Testing Pilot

# Mutation-tests each canonical owner in scripts/run_mutation_pilot.py, one
# shard per owner (#4121). A shard fails when a mutant survives that the
# baseline does not record, when the owner's kill rate drops below its floor
# in tests/mutation/baseline.json, or when a run is incomplete. Every shard
# also runs the negative control: losing one killed mutant must fail the floor.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing-pilot
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  owners:
    name: List mutation owners
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      keys: ${{ steps.list.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: List owner keys
        id: list
        run: |
          keys=$(uv run --frozen --extra dev python scripts/run_mutation_pilot.py --list-owners)
          echo "keys=$keys" >> "$GITHUB_OUTPUT"

  mutation-pilot:
    name: Mutation owner (${{ matrix.owner }})
    needs: owners
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        owner: ${{ fromJSON(needs.owners.outputs.keys) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install frozen development dependencies
        run: uv sync --frozen --extra dev

      - name: Mutate one owner and enforce its baseline
        env:
          OWNER: ${{ matrix.owner }}
        run: |
          uv run --frozen --extra dev python scripts/run_mutation_pilot.py \
            --owner "$OWNER" \
            --negative-control \
            --max-children 2 \
            --output "mutation-report-$OWNER.json"

      - name: Upload deterministic mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.owner }}
          path: mutation-report-${{ matrix.owner }}.json
          if-no-files-found: error
          retention-days: 14
