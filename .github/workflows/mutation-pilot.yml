name: Mutation Kill-Rate Floors

# Scheduled, not a PR check: runs owner-scoped mutation testing and fails when
# any owner's kill rate drops below the floor recorded in
# tests/mutation/floors.json. PRs only run the sub-second floor ratchet in the
# CI Lint job (floors never lower).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-kill-rate-floors
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  mutation-floors:
    name: Mutation Kill-Rate Floors
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install frozen development dependencies
        run: uv sync --frozen --extra dev

      - name: Restore exact-input mutation cache
        id: mutation-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: >-
            mutation-floors-v2-${{ runner.os }}-${{
            hashFiles(
              'uv.lock',
              'pyproject.toml',
              'scripts/ratchet_baseline.py',
              'scripts/run_mutation_pilot.py',
              'tests/mutation/floors.json',
              'src/apm_cli/**/*.py',
              'tests/**/*.py'
            ) }}

      - name: Run mutation and enforce per-owner floors
        shell: bash
        run: |
          args=()
          if [[ "${{ steps.mutation-cache.outputs.cache-hit }}" == "true" ]]; then
            args+=(--reuse-cache)
          fi
          uv run --frozen --extra dev python scripts/run_mutation_pilot.py \
            --max-children 4 \
            --output mutation-floors-report.json \
            "${args[@]}"

      - name: Negative control (a dropped kill rate must fail the floor check)
        if: success()
        # Re-reads this run's mutmut evidence with every kill of one owner
        # turned into a survivor; exits 0 only if the floor check catches it.
        run: >-
          uv run --frozen --extra dev python scripts/run_mutation_pilot.py
          --negative-control executable-trust-context

      - name: Upload deterministic mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-floors-report
          path: mutation-floors-report.json
          if-no-files-found: error
          retention-days: 14
