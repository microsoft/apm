name: TIA probe

# Test impact analysis, phase S0 probe (#4508). Shadow measurement only: it
# records which source files each lifecycle smoke test reaches, in process and
# in the `apm` subprocesses it launches, and uploads a summary. It selects and
# skips nothing, gates nothing, and is not a required check. It runs when its
# own files change and on demand.

on:
  pull_request:
    paths:
      - '.github/workflows/tia-probe.yml'
      - 'scripts/tia/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tia-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  probe:
    name: TIA probe (Linux, lifecycle smoke shard 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIFECYCLE_SHARD: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        save-cache: 'false'

    - name: Install Unix shell startup test runtimes
      run: bash scripts/ci-apt-install.sh fish zsh

    - name: Install dependencies
      run: uv sync --frozen --extra dev

    - name: Select shard test files
      run: |
        uv run --extra dev python -m scripts.ci_sharding files \
          --shard-count 5 --shard-index "$LIFECYCLE_SHARD" \
          --shard-durations .github/ci-durations/lifecycle-smoke.json \
          -m 'lifecycle_smoke and not lifecycle_merge_group' --out shard-files.txt \
          tests/integration tests/lifecycle

    - name: Run the shard under the probe
      env:
        APM_E2E_TESTS: "1"
        COVERAGE_FILE: ${{ github.workspace }}/build/tia/workers/.coverage
        TIA_PROBE_DIR: ${{ github.workspace }}/build/tia/tests
      run: |
        mkdir -p build/tia/workers build/tia/tests
        uv run --extra dev coverage run --rcfile scripts/tia/coveragerc -m pytest \
          -p scripts.tia.probe -p no:cacheprovider -q --strict-markers \
          -n 4 --dist loadgroup \
          -m 'lifecycle_smoke and not lifecycle_merge_group' @shard-files.txt

    - name: Summarize
      if: always()
      run: |
        uv run --extra dev python -m scripts.tia.report build/tia/tests build/tia/workers \
          | tee build/tia/summary.json
        cat build/tia/summary.json >> "$GITHUB_STEP_SUMMARY"

    - name: Upload probe data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tia-probe
        path: build/tia/
        retention-days: 7
        if-no-files-found: warn
