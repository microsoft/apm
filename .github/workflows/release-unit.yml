name: Release unit shard

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      binary-name:
        type: string
        required: true
    secrets:
      GH_CLI_PAT:
        required: false
      GH_MODELS_PAT:
        required: false

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Restore unit scheduling hints
        uses: ./.github/actions/pytest-timing
        with:
          suite: unit
      - name: Run unit tests
        if: inputs.platform != 'windows'
        env:
          GITHUB_TOKEN: ${{ inputs.platform == 'linux' && secrets.GH_MODELS_PAT || '' }}
          GITHUB_APM_PAT: ${{ inputs.platform == 'linux' && secrets.GH_CLI_PAT || '' }}
        run: >-
          uv run --frozen pytest
          tests/unit tests/test_console.py
          -n auto --dist worksteal --durations=50 --store-durations
          --junitxml=test-results/unit.xml
      - name: Run unit tests (Windows diagnostics)
        if: inputs.platform == 'windows'
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_PAT }}
          GITHUB_APM_PAT: ${{ secrets.GH_CLI_PAT }}
        run: >-
          uv run --frozen pytest
          tests/unit tests/test_console.py
          -n auto --dist worksteal --durations=50 --store-durations
          --junitxml=test-results/unit.xml
          -vv --tb=short --show-capture=no --no-showlocals
      - name: Upload unit timings and outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_attempt }}-${{ inputs.binary-name }}-unit
          path: |
            test-results/
            .test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
