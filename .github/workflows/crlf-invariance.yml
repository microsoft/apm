name: CRLF Invariance (apm#1952)

# Empirical cross-platform proof that the per-deployed-file content hash is
# line-ending invariant. The probe drives the REAL git core.autocrlf=true
# translation through the product's compute_file_hash (the single function both
# `apm install` record and `apm audit` verify call), so a Windows checkout
# (CRLF on disk) and a POSIX checkout (LF on disk) MUST yield the identical
# hash. The gather job fails if the three OS hashes are not byte-identical.
#
# Also probes apm#2619: the marketplace-plugin synthesize+stamp chain writes a
# synthetic apm.yml INSIDE the tree compute_package_hash hashes raw, so those
# writers must emit LF bytes on every OS or the lockfile content_hash (and
# `apm install --frozen`) breaks across platforms.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/apm_cli/utils/content_hash.py'
      - 'src/apm_cli/utils/atomic_io.py'
      - 'src/apm_cli/utils/yaml_io.py'
      - 'src/apm_cli/deps/plugin_parser.py'
      - 'src/apm_cli/deps/package_validator.py'
      - 'src/apm_cli/deps/github_downloader.py'
      - 'src/apm_cli/models/validation.py'
      - 'scripts/crlf_invariance_probe.py'
      - '.github/workflows/crlf-invariance.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/apm_cli/utils/content_hash.py'
      - 'src/apm_cli/utils/atomic_io.py'
      - 'src/apm_cli/utils/yaml_io.py'
      - 'src/apm_cli/deps/plugin_parser.py'
      - 'src/apm_cli/deps/package_validator.py'
      - 'src/apm_cli/deps/github_downloader.py'
      - 'src/apm_cli/models/validation.py'
      - 'scripts/crlf_invariance_probe.py'
      - '.github/workflows/crlf-invariance.yml'
  # Merge queues do not support path filtering; run unconditionally there so
  # a regression cannot slip through the queue unprobed.
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Run cross-platform content-hash probe
        run: uv run --frozen --python ${{ env.PYTHON_VERSION }} python scripts/crlf_invariance_probe.py --out hash.txt

      - name: Upload hash artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crlf-hash-${{ matrix.os }}
          path: hash.txt

  gather:
    name: Assert identical hashes
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - name: Download all hash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crlf-hash-*
          path: hashes

      - name: Compare hashes across platforms
        run: |
          set -euo pipefail
          echo "Per-OS recorded hashes:"
          for f in hashes/*/hash.txt; do
            printf '  %-28s %s\n' "$f" "$(cat "$f")"
          done
          UNIQUE=$(cat hashes/*/hash.txt | sort -u | wc -l | tr -d ' ')
          if [ "$UNIQUE" != "1" ]; then
            echo "::error::content hash diverges across platforms ($UNIQUE distinct values) -- apm#1952 (file hash) or apm#2619 (synthetic package hash) regression; compare the two |-separated envelope halves above"
            exit 1
          fi
          echo "[+] All platform hashes are byte-identical -- line-ending invariant."
