name: CRLF Invariance (apm#1952)

# TEMPORARY evidence-only override on branch wip/4601-evidence (never merged).
# Dispatch: gh workflow run crlf-invariance.yml --ref wip/4601-evidence
# Runs the #4601 policy cache evidence on windows-latest against the pre-fix
# and the fixed commit.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  FLAKY: tests/unit/policy/test_cache_atomicity.py::TestCacheAtomicity::test_concurrent_writers_no_torn_files
  REGRESSION: tests/unit/policy/test_cache_atomicity.py::TestCacheAtomicity::test_reader_holding_metadata_does_not_tear_the_pair

jobs:
  evidence:
    name: 4601 ${{ matrix.label }} (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before-fix
            sha: c1bb9d2b27f4a3d0f9d10665b4633c3b12305ff2
          - label: after-fix
            sha: 6155534969d77c9542d9aea7991df5c9758503c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidence-src
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra dev
      - name: Code under test
        shell: pwsh
        run: |
          git log --oneline -1
          Select-String -Path src/apm_cli/policy/discovery.py -Pattern 'replace\(.*(tmp_policy|tmp_meta)'
      - name: Regression case (Windows open handle on the metadata sidecar)
        shell: pwsh
        continue-on-error: ${{ matrix.label == 'before-fix' }}
        run: uv run --frozen pytest -p no:cacheprovider -n0 -q "$env:REGRESSION"
      - name: Diagnostic loop (500 iterations, records os.replace errors)
        shell: pwsh
        run: uv run --frozen python evidence-src/evidence/diag_4601.py 500
      - name: Flaky test, 40 separate pytest runs
        shell: pwsh
        run: |
          $fails = 0
          for ($i = 1; $i -le 40; $i++) {
            uv run --frozen pytest -p no:cacheprovider -n0 -q "$env:FLAKY" | Select-Object -Last 1
            if ($LASTEXITCODE -ne 0) { $fails++ ; Write-Host "iteration $i FAILED" }
          }
          Write-Host "flaky-test loop: 40 runs, $fails failed"
          if ($fails -ne 0 -and "${{ matrix.label }}" -eq "after-fix") { exit 1 }
          exit 0
