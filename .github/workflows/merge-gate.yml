# Merge Gate -- single-authority orchestrator that aggregates ALL required
# checks into one verdict for BOTH PR-time and merge-queue contexts.
# Branch protection / merge-queue ruleset requires only this check; this
# workflow polls the Checks API for all underlying checks.
#
# Why this file exists:
#   GitHub's required-status-checks model is name-based, not workflow-based.
#   Without this gate, every required check would need to be listed in the
#   ruleset (and listed again for the merge-queue ruleset) -- adding or
#   renaming a check meant editing rulesets. With this gate, the ruleset
#   requires only 'gate' and the gate aggregates whatever underlying checks
#   we declare in EXPECTED_CHECKS for each event context.
#
# Why both pull_request and merge_group triggers:
#   The merge-queue ruleset also requires 'gate'. Without a merge_group
#   trigger, the gate check would never fire against the merge-queue temp
#   branch SHA and PRs would sit in the queue with 'gate' stuck in
#   "Expected -- Waiting for status to be reported" indefinitely
#   (observed on PR #899). The merge_group trigger fires the same gate
#   logic against the temp branch SHA and aggregates the merge-queue-time
#   checks (ci.yml + ci-integration.yml). This merge_group run is the
#   merge-time gate: full integration, binary build, release validation
#   and the global coverage floor block only here.
#
# Keeping the merge-time gate honest:
#   - tests/quality/test_ci_topology.py fails unless every merge_group
#     EXPECTED_CHECKS name is produced by exactly one merge_group job, and
#     every PR-time check is also required at merge time.
#   - merge-queue-freshness.yml fails when main received commits but no
#     merge_group run of ci-integration.yml completed in the last 3 days,
#     i.e. when merges reach main without passing through this gate.
#
# Why no pull_request_target dual trigger:
#   We tried dual-trigger redundancy in PR #865 to harden against rare
#   dropped 'pull_request' webhook deliveries (observed once on PR #856).
#   It backfired: 'concurrency: cancel-in-progress' produced TWO check-runs
#   per SHA -- one SUCCESS and one CANCELLED -- which poisons branch
#   protection's status-check rollup ('CANCELLED' counts as failure ->
#   PR BLOCKED). pull_request and merge_group are different event channels
#   that target different SHAs, so they don't collide.
#
# Recovery if a webhook is dropped:
#   pull_request context:
#     - Push an empty commit:  git commit --allow-empty -m 'retrigger' && git push
#     - Or close + reopen the PR.
#   merge_group context (NB: pushing a commit will not retrigger the
#   merge_group event, only pull_request):
#     - Remove the PR from the merge queue and re-add it.

name: Merge Gate

on:
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
    types: [ checks_requested ]

# Dedup pushes to the same PR / merge-queue entry: cancel any older
# in-flight gate run on the same head. In merge_group context, github.ref
# is refs/heads/gh-readonly-queue/main/pr-N-<sha>, which is unique per
# queue entry -- so cancel-in-progress only cancels rapid push-after-push
# on the same temp branch, never across PR <-> merge_group channels.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    # Job timeout sized above the poll budget (TIMEOUT_MIN below) to leave
    # headroom for setup/teardown without false-failing the gate.
    timeout-minutes: 90
    steps:
      - name: Resolve target and trusted SHAs
        id: sha
        run: |
          case "${{ github.event_name }}" in
            merge_group)
              # Temp merge commit on the merge-queue temp branch; check
              # runs from ci.yml/ci-integration.yml are reported here, NOT
              # against the PR head SHA.
              target_sha="${{ github.event.merge_group.head_sha }}"
              trusted_sha="${{ github.event.merge_group.base_sha }}"
              ;;
            *)
              target_sha="${{ github.event.pull_request.head.sha }}"
              trusted_sha="${{ github.event.pull_request.base.sha }}"
              ;;
          esac
          if [ -z "$target_sha" ] || [ -z "$trusted_sha" ]; then
            echo "::error::Could not resolve target/trusted SHAs for event ${{ github.event_name }}"
            exit 1
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "trusted_sha=$trusted_sha" >> "$GITHUB_OUTPUT"
          echo "[merge-gate] event=${{ github.event_name }} target=$target_sha trusted=$trusted_sha"

      - name: Checkout trusted gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci

      - name: Wait for all required checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.target_sha }}
          EVENT_NAME: ${{ github.event_name }}
          # All required checks the gate aggregates, branched by event:
          #   pull_request -> ci.yml (+ notice-drift.yml) at PR time, plus
          #                   the four ci-integration.yml checks when the PR
          #                   is labeled `full-integration`
          #   merge_group  -> the PR-time checks, Coverage Combine and the
          #                   four ci-integration.yml checks
          # tests/quality/test_ci_topology.py keeps this in sync with the
          # jobs that actually run on merge_group.
          # "Test Architecture Ratchets" is required in every context: it gates
          # the deterministic tests/quality contracts (including the
          # merge-time topology guards in test_ci_topology.py). It does not
          # depend on "Architecture Scaling (Linux)", a wall-clock ratio that
          # stays non-required because timing asserts flake.
          # A PR labeled `full-integration` also runs ci-integration.yml at
          # PR time, so its four checks are required then too; unlabeled
          # PRs never wait for them.
          # NOTE: 'gate' (this job) MUST NOT appear here -- it would
          # deadlock waiting for itself.
          # PR context: only the shard jobs gate. Coverage Combine runs
          # in parallel as a non-required signal so global 80% drift is
          # visible in the PR UI without paying ~3 min of runner-
          # allocation latency on the critical path.
          # merge_group context: Coverage Combine IS required, so the
          # global 80% floor blocks the actual merge.
          # Lifecycle Smoke (Linux) is required in BOTH contexts: it's a
          # hermetic, ~65-70s ci.yml job (runs on pull_request AND
          # merge_group, same as APM Self-Check / NOTICE Drift Check),
          # promoting the smallest stable subset of the real
          # Consume/Produce/Govern lifecycle contracts -- selected
          # declaratively via the `lifecycle_smoke` pytest marker,
          # including the direct #2226/#2240 regression tests -- onto
          # the PR-time critical path.
          # "Windows Compatibility Gate" is also required at BOTH
          # PR-time and merge-queue-time: it is the only Windows signal
          # that runs before merge (build-release.yml's full Windows
          # matrix only runs post-merge on push to main), so it must
          # gate the class of Windows-only regressions fixed in
          # microsoft/apm#2233 rather than surfacing only after landing
          # on main.
          EXPECTED_CHECKS: ${{ github.event_name == 'merge_group' && 'Build & Test Shard 1 (Linux),Build & Test Shard 2 (Linux),Coverage Combine (Linux),Windows Compatibility Gate,APM Self-Check,NOTICE Drift Check,Lifecycle Smoke (Linux),Test Architecture Ratchets,Build (Linux),Smoke Test (Linux),Integration Tests (Linux),Release Validation (Linux)' || contains(github.event.pull_request.labels.*.name, 'full-integration') && 'Build & Test Shard 1 (Linux),Build & Test Shard 2 (Linux),Windows Compatibility Gate,APM Self-Check,NOTICE Drift Check,Lifecycle Smoke (Linux),Test Architecture Ratchets,Build (Linux),Smoke Test (Linux),Integration Tests (Linux),Release Validation (Linux)' || 'Build & Test Shard 1 (Linux),Build & Test Shard 2 (Linux),Windows Compatibility Gate,APM Self-Check,NOTICE Drift Check,Lifecycle Smoke (Linux),Test Architecture Ratchets' }}
          # Poll budget: ci-integration.yml chains Build -> Smoke ->
          # planned Integration shards (timeout 25m) -> fan-in, with
          # Release Validation (timeout 20m) in parallel. Expected
          # 16-18m end-to-end; sized at 80m to absorb runner queueing
          # without false-failing the gate.
          TIMEOUT_MIN: '80'
          # The Checks API calls of every open gate run share the repository's
          # Actions installation quota with CodeQL and other repository
          # automation. A 5s poll across dozens of concurrent gate runs exhausted
          # it; 30s adds at most ~25s of gate latency.
          # cancel-in-progress concurrency bounds parallel polling per PR.
          POLL_SEC: '30'
        run: |
          chmod +x .github/scripts/ci/merge_gate_wait.sh
          .github/scripts/ci/merge_gate_wait.sh


