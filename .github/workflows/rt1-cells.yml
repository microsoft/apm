name: rt1-cells
on:
  push:
    branches: ['w3d/rt1-cells']
permissions:
  contents: read
jobs:
  cells:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: '3.12'
    - run: uv sync --frozen --extra dev
    - run: uv run --frozen --extra dev python -m pytest -p no:cacheprovider -n 0 -q -rA tests/integration/test_verdict_record.py -k rt1
