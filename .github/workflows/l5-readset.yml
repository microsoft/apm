name: L5 read-set audit
on:
  push:
    branches: ['perf-readset/**']
permissions:
  contents: read
jobs:
  readset:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: mine
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        path: harness
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: strace
      run: sudo apt-get install -y -qq strace >/dev/null
    - name: Install the CLI under audit
      run: |
        set -euo pipefail
        sha=$(cat mine/scripts/perf/l5_readset_sha)
        git -C harness fetch --quiet --no-tags origin "$sha"
        git -C harness worktree add --quiet --detach ../new FETCH_HEAD
        (cd new && uv sync --frozen --no-editable --quiet)
    - name: Audit
      working-directory: harness
      run: |
        uv sync --frozen --extra dev --quiet
        cp ../mine/scripts/perf/l5_readset.py scripts/perf/
        uv run --frozen python scripts/perf/l5_readset.py "$GITHUB_WORKSPACE/new/.venv/bin/apm" "$RUNNER_TEMP/rs" tree-10 tree-10-mcp tree-10-multi monorepo-4 tree-10-policy tree-50
