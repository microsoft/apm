name: PR Release Wall-Clock Proof

on:
  pull_request:
    types: [labeled]
  push:
    branches: [danielmeppiel-release-wallclock-proof]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-wallclock-proposed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan proposed wall-clock run
    if: github.event_name == 'push' || github.event.label.name == 'ci-release-wallclock'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Select all five production catalog platforms
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) {
              throw new Error('Use a fresh labelled run, not a partial or mixed-attempt rerun');
            }
            const fs = require('node:fs');
            const catalog = JSON.parse(fs.readFileSync('scripts/release-platforms.json', 'utf8'));
            core.setOutput('matrix', JSON.stringify({include: catalog}));

  source-checks:
    name: Candidate Source Checks
    needs: [plan]
    uses: ./.github/workflows/ci.yml
    with:
      suppress-pr-only-checks: true
    permissions:
      contents: read

  platforms:
    name: ${{ matrix.binary_name }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: read
      actions: read
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      binary-name: ${{ matrix.binary_name }}
      integration-markers: ${{ matrix.integration_markers }}
      integration-shard-count: ${{ matrix.integration_shard_count }}
      integration-xdist-workers: ${{ matrix.integration_xdist_workers }}
      integration-splitting-algorithm: ${{ matrix.integration_splitting_algorithm }}
      full-validation: true
      wallclock-evidence: true

  docs:
    name: Read-only documentation build
    needs: [plan]
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      pages_artifact_name: wallclock-proposed-docs-${{ github.run_attempt }}
      upload_pages_artifact: true

  wheels:
    name: Read-only Python distribution build
    needs: [plan]
    uses: ./.github/workflows/pypi-distributions.yml
    permissions:
      contents: read
    with:
      artifact_name: wallclock-proposed-python-${{ github.run_attempt }}
      upload_artifact: true

  candidate-ready:
    name: Record non-promotable native evidence
    needs: [plan, platforms, source-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      native_ids: ${{ steps.record.outputs.native_ids }}
      evidence_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-${{ github.run_attempt }}-apm-*
          path: candidate-artifacts
      - name: Capture native bytes and successful authorities without qualification
        id: record
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const {
              collectArchiveInventory, candidateVersion, configHashes, selectRequiredJobs,
            } = require('./scripts/release-candidate.cjs');
            const catalog = JSON.parse(fs.readFileSync('scripts/release-platforms.json', 'utf8'));
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const platforms = collectArchiveInventory({
              artifactRoot: 'candidate-artifacts', catalog, sha: context.sha,
            });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: context.runId, attempt_number: attempt, per_page: 100,
            });
            const required = selectRequiredJobs(jobs, catalog);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            const selected = catalog.map(row => {
              const name = `candidate-${attempt}-${row.binary_name}`;
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              if (matches.length !== 1) throw new Error(`Missing or ambiguous native artifact: ${name}`);
              return matches[0];
            });
            fs.writeFileSync('wallclock-native-index.json', JSON.stringify({
              kind: 'release-wallclock-native-index', promotable: false,
              head_sha: context.sha, run_id: context.runId, run_attempt: attempt,
              version: candidateVersion(platforms, context),
              config_hashes: configHashes(process.cwd()), platforms, required, artifacts: selected,
            }, null, 2));
            core.setOutput('native_ids', selected.map(artifact => artifact.id).join(','));
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallclock-proposed-native-index-${{ github.run_attempt }}
          path: wallclock-native-index.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify wall-clock artifacts
    needs: [plan, source-checks, platforms, candidate-ready, docs, wheels]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require every production authority and record artifact identities
        id: authorities
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ toJSON(needs) }}
          NATIVE_IDS: ${{ needs.candidate-ready.outputs.native_ids }}
        with:
          script: |
            const fs = require('node:fs');
            const {selectRequiredJobs} = require('./scripts/release-candidate.cjs');
            const results = JSON.parse(process.env.RESULTS);
            for (const name of ['plan', 'source-checks', 'platforms', 'candidate-ready', 'docs', 'wheels']) {
              if (results[name]?.result !== 'success') throw new Error(`${name} did not succeed`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT), per_page: 100,
            });
            const catalog = JSON.parse(fs.readFileSync('scripts/release-platforms.json', 'utf8'));
            const required = selectRequiredJobs(jobs, catalog);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const expected = [
              ...catalog.map(row => `candidate-${attempt}-${row.binary_name}`),
              `wallclock-proposed-docs-${attempt}`, `wallclock-proposed-python-${attempt}`,
              ...catalog.flatMap(row => [
                `test-results-${attempt}-${row.binary_name}-core`,
                `test-results-${attempt}-${row.binary_name}-unit`,
                ...Array.from({length: row.integration_shard_count}, (_, index) =>
                  `test-results-${attempt}-${row.binary_name}-integration-shard-${index + 1}`),
              ]),
            ];
            const selected = expected.map(name => {
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              if (matches.length !== 1) throw new Error(`Missing or ambiguous artifact: ${name}`);
              return matches[0];
            });
            const nativeIds = selected.slice(0, catalog.length).map(artifact => artifact.id).join(',');
            if (nativeIds !== process.env.NATIVE_IDS) {
              throw new Error('Native artifact IDs changed after evidence capture');
            }
            core.setOutput('docs_id', selected[catalog.length].id);
            core.setOutput('python_id', selected[catalog.length + 1].id);
            core.setOutput('observation_ids',
              selected.slice(catalog.length + 2).map(artifact => artifact.id).join(','));
            fs.mkdirSync('wallclock-results', {recursive: true});
            fs.writeFileSync('wallclock-results/authorities.json', JSON.stringify({
              promotable: false, required, artifacts: selected,
            }, null, 2));
      - name: Download immutable non-promotable native evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate-ready.outputs.evidence_id }}
          path: wallclock-native-evidence
      - name: Download exact current-run native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate-ready.outputs.native_ids }}
          path: wallclock-inputs/native
      - name: Download documentation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.authorities.outputs.docs_id }}
          path: wallclock-inputs/docs
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.authorities.outputs.python_id }}
          path: wallclock-inputs/python
      - name: Recheck indexed native bytes and prepare non-promotable assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const {configHashes, verifyLocalArchiveBytes} = require('./scripts/release-candidate.cjs');
            const evidence = JSON.parse(fs.readFileSync(
              'wallclock-native-evidence/wallclock-native-index.json', 'utf8'));
            if (evidence.kind !== 'release-wallclock-native-index' || evidence.promotable !== false ||
                evidence.run_id !== context.runId || evidence.head_sha !== context.sha ||
                evidence.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
                JSON.stringify(evidence.config_hashes) !== JSON.stringify(configHashes(process.cwd()))) {
              throw new Error('Non-promotable native index does not match this execution');
            }
            const catalog = JSON.parse(fs.readFileSync('scripts/release-platforms.json', 'utf8'));
            verifyLocalArchiveBytes({
              evidence, catalog, artifactRoot: 'wallclock-inputs/native',
              outputRoot: 'wallclock-verified-native',
            });
      - name: Download exact native runner observations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.authorities.outputs.observation_ids }}
          path: wallclock-inputs/native/observations
      - name: Verify built bytes without granting release qualification
        run: >-
          python -m scripts.release_wallclock verify
          --side proposed --source-root . --source-sha "$GITHUB_SHA"
          --native-root wallclock-inputs/native
          --docs-root wallclock-inputs/docs
          --python-root wallclock-inputs/python
          --output wallclock-results/proof.json
      - name: Upload verified native bytes without publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallclock-proposed-verified-native-${{ github.run_attempt }}
          path: wallclock-verified-native/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve non-promotable wall-clock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallclock-proposed-proof-${{ github.run_attempt }}
          path: wallclock-results/
          if-no-files-found: error
          retention-days: 30
