name: L5 profile
on:
  push:
    branches: ['perf-profile/**']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: harness
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Install CLI under test
      run: |
        set -euo pipefail
        sha=$(cat harness/scripts/perf/l5_target_sha)
        git -C harness fetch --quiet --no-tags origin "$sha"
        git -C harness worktree add --quiet --detach ../new FETCH_HEAD
        (cd new && uv sync --frozen --no-editable --quiet)
    - name: Install harness
      working-directory: harness
      run: uv sync --frozen --extra dev --quiet
    - name: Profile
      working-directory: harness
      run: uv run --frozen python scripts/perf/l5_profile.py "$GITHUB_WORKSPACE/new/.venv/bin/apm" "$RUNNER_TEMP/l5"
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: harness
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Checkout CLI under test
      run: |
        set -euo pipefail
        sha=$(cat harness/scripts/perf/l5_target_sha)
        git -C harness fetch --quiet --no-tags origin "$sha"
        git -C harness worktree add --quiet --detach ../new FETCH_HEAD
    - name: Lifecycle cells
      working-directory: new
      run: |
        uv sync --frozen --extra dev --quiet
        uv run --frozen pytest -p no:cacheprovider -q -n 2 -rA tests/lifecycle/security/test_noop_diff.py 2>&1 | tail -150
