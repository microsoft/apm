name: Lint chain
description: >-
  The repository lint chain, owned once and run by ci.yml's Lint job and by
  the merge-train guard job (merge-train.yml). The caller checks out the
  source and installs uv first.

inputs:
  base-sha:
    description: Base SHA the shrink-only ratchets compare against.
    required: true

runs:
  using: composite
  steps:
    - name: Ruff lint
      shell: bash
      run: >-
        uv run --frozen --extra dev ruff check
        src/ tests/
        scripts/lint_architecture_boundaries.py
        scripts/architecture_linter/
        scripts/windows_native_symlink_probe_entry.py

    - name: Ruff format check
      shell: bash
      run: >-
        uv run --frozen --extra dev ruff format --check
        src/ tests/
        scripts/lint_architecture_boundaries.py
        scripts/architecture_linter/
        scripts/windows_native_symlink_probe_entry.py

    - name: Complexity ratchet (Stage 2 limits, shrink-only baseline)
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        # New and changed functions must meet the Stage 2 Ruff limits; existing
        # violators are grandfathered in tests/quality/complexity_baseline.json.
        # Fails on new violations, stale entries, or baseline growth vs base.
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        uv run --frozen --extra dev python scripts/check_complexity_ratchet.py \
          --base-ref "$BASE_SHA"

    - name: Taxonomy allowance ratchet (shrink-only vs base)
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        # Unclassified, misplaced and promise-less allowances may only shrink;
        # an added entry is accepted only as a validated move of a removed one.
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        uv run --frozen --extra dev python scripts/check_taxonomy_allowances.py \
          --base-ref "$BASE_SHA"

    - name: Obligation status ratchet (required never silently demoted vs base)
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        # A lifecycle obligation required at the base stays required or
        # known-failing unless this change adds and names a removal or mapping
        # rule for it (#4586).
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        uv run --frozen --extra dev python scripts/check_obligation_status_ratchet.py \
          --base-ref "$BASE_SHA"

    - name: Check YAML encoding safety
      shell: bash
      run: |
        # Ensure YAML file I/O goes through yaml_io helpers.
        # Catches yaml.dump/safe_dump writing to a file handle outside yaml_io.py.
        VIOLATIONS=$(grep -rn --include='*.py' -P \
          'yaml\.(safe_)?dump\(.+,\s*[a-zA-Z_]\w*\b' src/apm_cli/ \
          | grep -v 'utils/yaml_io.py' \
          | grep -v '# yaml-io-exempt' \
          || true)
        if [ -n "$VIOLATIONS" ]; then
          echo "::error::Direct yaml.dump() to file handle detected. Use yaml_io.dump_yaml() instead:"
          echo "$VIOLATIONS"
          exit 1
        fi

    - name: File length guardrail
      shell: bash
      run: |
        # Ruff has no max-module-lines rule. This check prevents new files from
        # exceeding the current worst case. Tighten the threshold over time.
        MAX_LINES=2100   # Stage 1 (was 2450); target 1400 deferred to Stage 2
        VIOLATIONS=$(
          {
            find src/ scripts/architecture_linter/ -name '*.py' -print0
            printf '%s\0' scripts/lint_architecture_boundaries.py
          } | xargs -0 -I{} awk -v max="$MAX_LINES" \
            'END { if (NR > max) printf "%s: %d lines (max %d)\n", FILENAME, NR, max }' {}
        )
        if [ -n "$VIOLATIONS" ]; then
          echo "::error::Source files exceed $MAX_LINES-line limit:"
          echo "$VIOLATIONS"
          exit 1
        fi

    - name: Lint - no raw str(relative_to) patterns
      shell: bash
      run: |
        # Fail if any code uses str(x.relative_to(y)) instead of portable_relpath()
        if grep -rn --include="*.py" -P 'str\([^)]*\.relative_to\(' src/apm_cli/ | grep -v portable_relpath | grep -v '\.pyc'; then
          echo "::error::Found raw str(path.relative_to()) calls. Use portable_relpath() from apm_cli.utils.paths instead."
          exit 1
        fi

    - name: Code duplication guardrail (pylint R0801)
      shell: bash
      run: |
        uv run --frozen --extra dev python -m pylint \
          --disable=all --enable=R0801 \
          --min-similarity-lines=10 \
          --fail-on=R0801 \
          src/apm_cli/ \
          scripts/lint_architecture_boundaries.py \
          scripts/architecture_linter/ \
          scripts/windows_native_symlink_probe_entry.py

    - name: Lint - auth-protocol boundary (#1212 anti-regression)
      shell: bash
      run: bash scripts/lint-auth-signals.sh

    - name: Lint - architecture authority boundaries
      shell: bash
      run: bash scripts/lint-architecture-boundaries.sh
