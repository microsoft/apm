# Stable catalogue of the 25 lifecycle journeys (Part of #4110).
# Transcribed from the steward's journey model. Ids, step numbers and oracle ids
# are pinned by tests/quality/test_journey_index.py. key_lines must print;
# forbidden_lines must not print. Step oracles may also name an invariant
# (I1-I9) that an oracle's invariant field covers. docs paths are relative to
# docs/src/content/docs/; docs_unresolved keeps model paths with no page today.
schema_version: 1
oracles:
  O1:
    name: TRANSCRIPT
    invariant: '-'
    check: normalized stdout+stderr of each step equals the reviewed golden file tests/journeys/goldens/<J>/<step>.txt; package blocks compared as unordered units, lines inside a block ordered
    applies: golden journeys only (PR tier)
  O2:
    name: DOCS-OUTPUT
    invariant: '-'
    check: every docs output block that follows the command is an ordered subsequence of the normalized transcript; blocks marked abridged allow extra lines only from an allowlist; extra [!] or [x] lines are never allowed
    applies: every step that has a docs output block
  O3:
    name: ASCII
    invariant: I6
    check: every byte of stdout and stderr < 0x80 under LANG=C.UTF-8 and a UTF-8 terminal (force_terminal), so Rich cannot fall back silently
    applies: every binary invocation (global)
  O4:
    name: UNIQUE-QUIET
    invariant: I9
    check: (i) no identical normalized non-blank line twice within one command unless allowlisted per-item; (ii) per package block, (primitive kind, destination set) appears once; (iii) no adjacent repeated token; (iv) every diagnostic id requires its trigger fact in the state; (v) each diagnostic id at most once per command
    applies: every binary invocation (global)
  O5:
    name: EXIT
    invariant: I8
    check: exit code equals the journey step expectation and the docs exit table; any [x] line implies exit != 0; exit != 0 implies an [x] or error line; usage errors exit 2
    applies: every step
  O6:
    name: ANNOUNCED
    invariant: I7
    check: filesystem delta under project and HOME is fully attributed to announced lines or the command's declared write set; failing steps have an empty delta unless the partial state is announced; --frozen never modifies an existing deployed file
    applies: every mutating step
  O7:
    name: HELP-TRUTH
    invariant: '-'
    check: every flag in docs exists on that subcommand and vice versa; help claims ([experimental], deprecated, requires --X, mutually exclusive, exit 2) are probed and must match behavior; experimental commands never appear in root Common workflows or init Next Steps; help and docs enumerations are equal
    applies: help steps plus the CLI surface truth test
  O8:
    name: REMEDIATION-TRUTH
    invariant: I3
    check: 'parse every Run ''apm ...'' advice from a failing step, execute it in the same state, re-run the failing command: it must now pass (or reach the documented next state)'
    applies: every red step
  O9:
    name: FS-DELTA
    invariant: I1,I5
    check: files created/changed equal the journey's expected set; after the documented commit step git status --porcelain is empty; nothing outside project and declared user-scope roots
    applies: every mutating step
  O10:
    name: TWIN-FIDELITY
    invariant: '-'
    check: hermetic content twins are byte-shape equal to the real upstream at the documented ref (nightly), and the first-run journey on the real upstream prints zero [!] lines
    applies: J01, J04, J05, P01 (nightly real-network variant)
  O11:
    name: VENDOR-SHAPE
    invariant: '-'
    check: emitted vendor files validate against the vendor's published schema or a recorded vendor sample
    applies: J05, P03
  O12:
    name: EGRESS
    invariant: I4
    check: a recording proxy observes only allowed hosts; with PROXY_REGISTRY_ONLY=1 no direct host is contacted for packages, catalogs or MCP registry
    applies: E03
  O13:
    name: DOCS-AS-SCRIPT
    invariant: '-'
    check: journey commands are extracted from docs code fences and executed literally (placeholders substituted); pinned versions in docs equal the current release
    applies: every journey
normalizers:
  N1: 'env: NO_COLOR=1 TERM=dumb COLUMNS=200 LANG=C.UTF-8 APM_E2E_TESTS=1; strip ANSI'
  N2: 'hex placeholders: 40-hex -> <SHA40>, @8-hex -> @<SHA8>, sha256:64-hex -> sha256:<H>'
  N3: durations 'in 1.3s' -> 'in <DUR>'; dates -> <DATE>; apm version -> <VER>
  N4: 'paths: tmp root, HOME, APM_HOME, project -> <TMP>, <HOME>, <APM_HOME>, <PROJECT>; backslash -> slash'
  N5: package blocks ([+] header plus its |-- children) compared as a multiset of ordered blocks
  N6: 'no soft wrap: COLUMNS=200'
  N7: regen script rewrites goldens, refuses any golden that fails O3 or O4, prints the review diff; goldens carry a schema version header
journeys:
- id: J01
  persona: consumer
  title: First run (quickstart)
  golden: true
  tier: pr
  docs:
  - quickstart.mdx
  - getting-started/installation.md
  fixtures:
  - 'content twin of microsoft/apm-sample-package@v1.0.0 incl. transitive skill and mode: frontmatter'
  - local git HTTP server
  - empty org policy repo (outcome absent)
  steps:
  - n: 1
    cmd: apm --version
    argv:
    - - apm
      - --version
    kind: apm
    exit: 0
    key_lines:
    - <VER>
    forbidden_lines:
    - Traceback
    - A new version of APM is available
    files: []
    oracles:
    - O5
    - O3
  - n: 2
    cmd: apm --help
    argv:
    - - apm
      - --help
    kind: apm
    exit: 0
    key_lines:
    - 'Common workflows:'
    forbidden_lines:
    - apm run <script>
    files: []
    oracles:
    - O7
    - O3
  - n: 3
    cmd: apm init -y --target copilot,claude
    argv:
    - - apm
      - init
      - -y
      - --target
      - copilot,claude
    kind: apm
    exit: 0
    key_lines:
    - '[*] APM project initialized successfully!'
    - apm install <owner>/<repo>
    forbidden_lines:
    - 'Run a script:'
    - agentrc
    - non-ASCII box characters
    files:
    - apm.yml
    oracles:
    - O1
    - O2
    - O3
    - O4
    - O7
    - O9
  - n: 4
    cmd: apm install microsoft/apm-sample-package#v1.0.0
    argv:
    - - apm
      - install
      - microsoft/apm-sample-package#v1.0.0
    kind: apm
    exit: 0
    key_lines:
    - '[+] microsoft/apm-sample-package #v1.0.0 @<SHA8>'
    - '|-- 2 prompts integrated -> .github/prompts/'
    - '|-- 1 skill(s) integrated -> .agents/skills/'
    - '[*] Installed 2 APM dependencies in <DUR>.'
    forbidden_lines:
    - '[!]'
    - Skipped inactive experimental resolver
    - dependency unpinned
    - Skill integrated -> (twice for one package)
    - Traceback
    files:
    - apm.yml (dependency added)
    - apm.lock.yaml
    - apm_modules/ (gitignored)
    - .gitignore
    - .agents/skills/
    - .github/prompts/
    - .github/agents/
    - .github/instructions/
    - .claude/
    oracles:
    - O1
    - O2
    - O3
    - O4
    - O5
    - O6
    - O9
    - O10
  - n: 5
    cmd: git add apm.yml apm.lock.yaml .github .claude .agents && git commit -m 'Add agent dependencies' && git status --porcelain
    kind: shell
    exit: 0
    key_lines: []
    forbidden_lines:
    - ?? .apm-local/
    - ?? apm_modules/
    files: []
    oracles:
    - O9
    - O13
  - n: 6
    cmd: apm install (second run)
    argv:
    - - apm
      - install
    kind: apm
    exit: 0
    key_lines:
    - '[*]'
    forbidden_lines:
    - integrated
    - '[!]'
    files:
    - none changed; lock byte-identical (I2)
    oracles:
    - O1
    - O4
    - O6
    - O9
  - n: 7
    cmd: apm install microsoft/apm/packages/apm-guide#<release tag>
    argv:
    - - apm
      - install
      - microsoft/apm/packages/apm-guide#<release tag>
    kind: apm
    exit: 0
    key_lines:
    - '[*] Installed'
    forbidden_lines:
    - '[!]'
    files: []
    oracles:
    - O13
    - O4
