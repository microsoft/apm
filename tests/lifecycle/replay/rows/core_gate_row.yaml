# T-0 example row (#4093): a deny retires a deployed hook and keeps the skill.
id: T0/install/denied/hook
promises: [P-INV-I1, P-INV-I2, P-INV-I3, P-INV-I4, P-INV-I5, P-INV-I6, P-INV-I7, P-INV-I8, P-INV-I9]
cell: {OP: install, SRC: local-path, PRIM: hook, SCOPE: project, GATE: denied}
world: {packages: [p-skill, p-exec], targets: [copilot], scope: project}
given:
  - apm install p-skill p-exec
  - apm approve p-exec
  - apm install
  - apm install
when:
  - apm deny p-exec
  - {run: apm install --no-such-flag, exit: 2}
  - apm install
  - {pair: [apm audit --ci, apm install --frozen]}
then:
  exit: 0
  deployed: expected
  announce: hooks skipped (denied)
known_cells:
  - id: row-cell-target-root-recreated
    law: I2
    tracking: "#4132"
    step: apm install --frozen
    match: "^converged install-frozen rewrote files: \\['project:\\.github'\\]$"
