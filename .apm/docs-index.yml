# docs-index.yml -- corpus map for the docs-sync skill
#
# This file is the LOAD-BEARING ARTIFACT for the docs-sync agentic
# system. It records per-page metadata (title, persona, promise,
# documented symbols) and per-chapter abstracts (bridges, target
# persona). The docs-sync classifier consults this file (NOT the
# corpus itself) to bound its context envelope.
#
# Drift policy:
# - This file is committed alongside the docs corpus.
# - When the docs-sync skill emits a STRUCTURAL verdict (new page or
#   TOC reshape), it regenerates affected entries here as part of the
#   companion docs PR.
# - When the corpus changes through normal doc-writer work (Wave A-K
#   rewrite, ad-hoc edits), the editorial-owner is responsible for
#   refreshing affected entries in the same commit.
# - Stale entries are detectable via `apm docs-index lint` (TODO --
#   not yet implemented; for now, manual verification during shadow
#   phase).
#
# Coverage: pages[] lists every page under docs/src/content/docs/
# (regenerated 2026-11-19 for the zero-based docs redesign). The
# documents_symbols cli/flags lists are derived from the live CLI
# command tree, so a stale entry means the page mentions a command
# or option that no longer exists.

version: 1

# 3-promise narrative anchors. Every page belongs to exactly one.
promises:
  - id: 1
    slug: consume
    label: "Consume primitives"
    persona: consumer
    description: >-
      Bring agent primitives (skills, agents, instructions, prompts)
      into your project via apm install.
  - id: 2
    slug: produce
    label: "Produce primitives"
    persona: producer
    description: >-
      Author, compile, pack, and publish primitives to a marketplace.
  - id: 3
    slug: govern
    label: "Govern primitives"
    persona: enterprise
    description: >-
      Audit, policy-enforce, registry-proxy, drift-detect at team
      and org scale.

# Chapter-level abstracts. CDO reads these to weigh bridges.
chapters:
  - slug: getting-started
    abstract: >-
      Get started. Install APM, the five-minute quickstart (a skill, a
      marketplace plugin and an MCP server, locked and verified on a
      teammate's clone), coming from other tools, and private sources
      (authentication). Feeds the Use journey.
    bridges_to: [consumer, producer]
    target_persona: consumer
    promise: 1

  - slug: concepts
    abstract: >-
      Mental models: how APM works (manifest, lockfile, harnesses,
      install vs frozen, install plane vs runtime plane) and the agent
      supply chain (why teams build marketplaces of approved agent
      capabilities, and where APM's controls stop). Plus the glossary.
    bridges_to: [consumer, producer, enterprise]
    target_persona: cross
    promise: cross

  - slug: consumer
    abstract: >-
      Use skills, plugins and MCP servers. A developer or tech lead in one
      repository: add and remove packages, install from marketplaces,
      install plugins, add MCP and LSP servers, choose harnesses, approve
      executables, update dependencies, run in CI. Bridges to Publish
      when the reader wants to share their own.
    bridges_to: [producer]
    target_persona: consumer
    promise: 1

  - slug: producer
    abstract: >-
      Publish packages. A package author or central team: create a
      package, write skills/instructions/hooks, test locally, release a
      version, build a plugin, publish to a marketplace. Bridges forward
      to Govern (your organization's marketplace).
    bridges_to: [consumer, enterprise]
    target_persona: producer
    promise: 2

  - slug: enterprise
    abstract: >-
      Govern your organization. A platform or security team: rollout
      ladder, agent supply chain security model, org policy, pull request
      gates, executables, building the organization's marketplace,
      proxies and offline installs, inventory and drift.
    bridges_to: [producer]
    target_persona: enterprise
    promise: 3

  - slug: troubleshooting
    abstract: >-
      Symptom-indexed front door plus error-message lookup pages.
      Cross-cuts all personas; readers arrive here from search engines.
    bridges_to: [consumer, producer, enterprise]
    target_persona: cross
    promise: cross

  - slug: integrations
    abstract: >-
      Integrations A-Z index (each entry points to the task page that
      covers it) plus experimental integration pages.
    bridges_to: [consumer, producer, enterprise]
    target_persona: cross
    promise: cross

  - slug: reference
    abstract: >-
      Canonical reference for commands, package types, schemas.
      Cross-cuts all personas; readers arrive here for exact answers.
    bridges_to: [consumer, producer, enterprise]
    target_persona: cross
    promise: cross

  - slug: specs
    abstract: >-
      Normative OpenAPM specification and conformance statement.
      Owned by the apm-spec-guardian review path.
    bridges_to: [reference]
    target_persona: spec
    promise: meta

  - slug: about
    abstract: >-
      How APM compares to other tools, and organizations using APM.
    bridges_to: [consumer, enterprise]
    target_persona: cross
    promise: meta

  - slug: contributing
    abstract: >-
      How to contribute to APM itself. Out-of-band from the 3-promise
      narrative; addresses contributors not users.
    bridges_to: []
    target_persona: contributor
    promise: meta


