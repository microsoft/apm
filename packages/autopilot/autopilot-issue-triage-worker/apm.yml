name: autopilot-issue-triage-worker
version: 0.1.0
description: Advise on ONE microsoft/apm issue already selected by autopilot-issue-triage-scheduler. Advisory only. Never implements, never assigns, never lists the queue.
author: Microsoft
license: MIT
type: skill

# Stand-alone primitive: no transitive APM deps. Required specialist
# roles are consumer-provided companions checked in the deployed
# .github/agents/ directory before the worker gives advice.
dependencies:
  apm:
    - ../autopilot-comment
  mcp: []
