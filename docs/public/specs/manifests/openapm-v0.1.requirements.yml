    conformance_class: consumer
    notes: "a schema-bearing Agent Plugins v1 dependency stays opaque to legacy projection at deployment; target exclusion may retain materialization and lock state but creates no native registration or primitive projection, remains nonfatal to ordinary mixed-batch dependencies, and is reported consistently by dry-run"
  - id: req-tg-012
    keyword: MUST
    section: "8.5.6"
    conformance_class: consumer
    notes: "implementation-defined plugin-root placeholders preserve balanced expandable double quoting across split-quote forward- or backslash path spelling and unresolved placeholders emit a default-visible diagnostic"
  - id: req-tg-013
    keyword: MUST
    section: "8.5.7"
    conformance_class: consumer
    notes: "schema, effective-target, integrity, security, and executable admission drives one in-place aggregate registration opaque to legacy projection without lifecycle host-binary probing; only admitted dependencies participate in claimant selection and registration, direct dependencies win plugin-name collisions over transitive dependencies, equal-precedence collisions fail during admission, advisory cleanup omits ambiguous or changed-owner entries, and ledger-primary ownership permits exact-entry recovery of a reserved namespace while rejecting foreign collisions and invalid JSON, preserving unrelated JSON semantics, and rolling back catalog, ledger, and settings together"
  - id: req-tg-014
    keyword: MUST
    section: "8.5.8"
    conformance_class: consumer
    notes: "user-scoped MCP target selection uses a disclosed versioned capability contract, ignores project-only detection signals, applies first-source precedence without fallback, filters mixed sets, and refuses zero-supported selections before user manifest, lockfile, or target-config mutation"
  - id: req-tg-015
    keyword: MUST
    section: "8.5.1"
    conformance_class: consumer
    notes: "a conforming consumer providing the Codex-native agent conversion capability preserves a source-declared model or model_reasoning_effort string value in its native top-level placement, leaves either field absent when absent from the source, diagnoses a non-string source value by field name without including that value, and emits a diagnostic bounded on dropped-field count (at least one shown when any are dropped), per-field name length, and ASCII-sanitized field-name display (never the value) for any other dropped, non-capability-restriction frontmatter field"
  - id: req-tg-016
    keyword: MUST
    section: "8.5.9"
    conformance_class: consumer
    notes: "a Cursor-native hook installation implementation fails closed (no partial write) when converting a source-declared hook configuration whose event, top-level key, or handler field falls outside the accepted Cursor-native vocabulary, emitting an actionable diagnostic naming the unrecognized value(s)"
  - id: req-tg-017
    keyword: MUST
    section: "8.5.9"
    conformance_class: consumer
    notes: "a Cursor-native hook installation implementation detects, before writing, an observable overlap with an in-effect Claude-settings hook import for either install order, and rejects the write with an actionable diagnostic rather than merging, redirecting, or broadening accepted input, without altering the Claude import's own settings"
  - id: req-tg-018
    keyword: MUST
    section: "8.5.10"
    conformance_class: consumer
    notes: "a Cursor instruction whose normalized applyTo is exactly one universal ** pattern (scalar, padded, or single-item list) emits alwaysApply: true with no globs at project and user scope; other non-empty sets, including ** mixed with scoped patterns, keep globs; absent, empty, or null applyTo emits neither key"
  - id: req-na-001
    keyword: MUST
    section: "8.5.11"
    conformance_class: consumer
    notes: "a consumer that natively activates does so only for a target selected by the req-tg-008 effective target intersection and a scope and disclosed client version that meets Part A criteria A1-A5 by published documentation; unknown qualification does not qualify; the conformance statement discloses each target, scope, oldest qualified version and cited source per criterion"
  - id: req-na-002
    keyword: MUST
    section: "8.5.11"
    conformance_class: consumer
    notes: "activated set derives only from the lockfile; only the approved plugin root is deployed from locked bytes to <profile root>/<plugin>/ under a safe single-segment name (no leading dot, trailing dot or space, separators, @, :, or control bytes; Unicode case-fold collisions refused) with req-tg-013 claimant selection; the lock records the root and a pinned sha256 root digest over every regular file's byte-wise sorted POSIX path (no normalization; .git components and the consumer's root apm.yml and .apm/ normalization output excluded, not deployed, and not referenceable by the manifest), NUL, exec-bit byte and raw content digest; symlinks or escaping paths make the plugin ineligible, handled like req-na-006 and never silent; checked for drift with expected and observed digests; a generated .claude-plugin/marketplace.json lists only activated plugins by relative path; the resolved dependency root is never declared; project-scope output is not ignored; the deployed root substitutes for in-place placement under req-tg-013"
  - id: req-na-003
    keyword: MUST
    section: "8.5.11"
    conformance_class: consumer
    notes: "declaration only through documented activation entries in the A1 settings file, with a local directory source at the profile root, relative at project scope; no other keys, private target state, trust decisions or autoUpdate; no target binary, CLI or RPC located, invoked or version-checked during install, update, restore, uninstall or prune"
  - id: req-na-004
    keyword: MUST
    section: "8.5.11"
    conformance_class: consumer
    oracle: tests/fixtures/spec-conformance/native-activation/req-na-004.json
    notes: "ownership of activation entries, deployed roots and marketplace entries derives from the previous and next lockfile plus the source binding; add what next needs, remove only what previous produced with the same binding; preserve unrelated keys and explicit false; with a missing previous lock and an existing entry remove nothing and report; a moved or renamed binding or foreign entry is reported, nothing is written under either name and no second marketplace is declared for the same profile root; first activation needs no diagnostic; the consumer owns only lock-produced plugin roots and the generated marketplace under the profile root and never overwrites an unowned plugin directory unless its digest matches; unparseable settings fail closed; one rollback unit; no receipt or ledger file"
  - id: req-na-005
    keyword: MUST
    section: "8.5.11"
    conformance_class: consumer
    notes: "a consumer that natively activates writes enable true only when an implementation-defined, disclosed approval bound to the req-na-002 root digest covers the plugin root and the req-tg-013 admission gates (lock integrity, req-sc-015 scan, executable authorization) admit it for every plugin format; an update to uncovered content keeps the previous lock entry, root and entries with a diagnostic, or retires them in the lock write's rollback unit; the lock never pins undeployed content; otherwise not deployed under the profile root, not declared, never declared disabled, with a default-visible diagnostic; never replace a deployed root with uncovered content"
  - id: req-na-006
    keyword: MUST
    section: "8.5.11"
    conformance_class: consumer
    notes: "a consumer that natively activates gives a target and scope that does not qualify no native activation and no private state or activation entries; explicit split install or refusal with a default-visible diagnostic naming target, scope and unmet or unknown criterion (A1-A5); never silent; dry-run reports the same decision; req-tg-011 governs opaque dependencies; req-tg-013 registrations without native activation are unaffected"
  - id: req-na-007
