    conformance_class: consumer
    notes: "generated marketplace name is deterministic, stable across clones of one project by a disclosed project identity and independent of user, host and absolute path at project scope, distinct between projects and between project and user scope; a name already declared with a different source is refused with a diagnostic before activation entries are written"
